name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m py_compile src/paideia_genius_derivation/genius_derivation.py src/paideia_genius_derivation/cli.py src/paideia_genius_derivation/__init__.py src/paideia_genius_derivation/__main__.py

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Security scan
        run: python -m bandit -q -r src -c pyproject.toml
